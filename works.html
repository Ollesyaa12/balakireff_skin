<div class="lightbox-modal" id="lightboxModal">
  <span class="lightbox-close" id="lightboxClose">&times;</span>
  
  <!-- Стрелка влево -->
  <button class="lightbox-arrow lightbox-prev" id="lightboxPrev">❮</button>
  
  <!-- Само фото -->
  <img src="" alt="Просмотр" class="lightbox-img" id="lightboxImg">
  
  <!-- Стрелка вправо -->
  <button class="lightbox-arrow lightbox-next" id="lightboxNext">❯</button>
</div>

<script>
  // --- ЛАЙТБОКС ---
  const lightboxModal = document.getElementById('lightboxModal');
  const lightboxImg = document.getElementById('lightboxImg');
  const lightboxClose = document.getElementById('lightboxClose');
  
  // Находим все ссылки с классом .lightbox
  const lightboxLinks = document.querySelectorAll('.lightbox');

  // Для каждой ссылки вешаем клик
  lightboxLinks.forEach(link => {
    link.addEventListener('click', (e) => {
      e.preventDefault();           // Отменяем переход по ссылке
      const imgSrc = link.getAttribute('href'); // Берем путь из href
      lightboxImg.src = imgSrc;     // Подставляем в модальное окно
      lightboxModal.classList.add('active'); // Показываем окно
    });
  });

  // Закрытие по крестику
  lightboxClose.addEventListener('click', () => {
    lightboxModal.classList.remove('active');
  });

  // Закрытие по клику на темный фон (мимо фото)
  lightboxModal.addEventListener('click', (e) => {
    if (e.target === lightboxModal) {
      lightboxModal.classList.remove('active');
    }
  });

  // Закрытие по клавише Esc
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && lightboxModal.classList.contains('active')) {
      lightboxModal.classList.remove('active');
    }
  });
</script>

        <script>
  // ФИЛЬТРАЦИЯ ГАЛЕРЕИ
  const filterButtons = document.querySelectorAll('.filter-btn');
  const galleryItems = document.querySelectorAll('.gallery-item');

  filterButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      // Убираем активный класс у всех кнопок
      filterButtons.forEach(b => b.classList.remove('active'));
      // Добавляем нажатой кнопке
      btn.classList.add('active');

      const filterValue = btn.getAttribute('data-filter');

      galleryItems.forEach(item => {
        if (filterValue === 'all' || item.classList.contains(filterValue)) {
          item.classList.remove('hide');
        } else {
          item.classList.add('hide');
        }
      });
    });
  });
</script>
